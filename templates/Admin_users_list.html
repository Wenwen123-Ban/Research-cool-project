<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LBAS | User Audit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">User Audit</h1>
      <a href="{{ url_for('index_gateway') }}" class="btn btn-sm btn-outline-primary">Back to Dashboard</a>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr><th>School ID</th><th>Name</th><th>Status</th><th>Category</th></tr>
            </thead>
            <tbody>
              {% for user in users %}
              <tr>
                <td>{{ user.school_id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.status or 'approved' }}</td>
                <td>{{ user.category or 'N/A' }}</td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
